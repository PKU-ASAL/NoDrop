- rule: Simulated NODROP Shadow Access
  desc: detect shadow
  condition: >
    jevt.value[/evt.type] in (open, openat)
    and jevt.value[/evt.dir] == "<"
    and jevt.value[/fd.name] == "/etc/shadow"
  output: "[NODROP-SIM] Real-time syscall detected via Plugin: (user=%jevt.val>
  priority: WARNING
  source: nodrop